name: Package index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate:
    name: Package index validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Hermit source
        run: ./bin/hermit validate source "file://$PWD"
      - name: Lint updater and workflows
        run: |
          ./bin/shellcheck scripts/update_homelab.sh
          ./bin/actionlint
      - name: Reject invalid updater events
        run: |
          if SOURCE_REPOSITORY=invalid TAG=v0.3.0 VERSION=0.3.0 RELEASE_ID=1 RELEASE_URL=https://example.invalid ./scripts/update_homelab.sh; then exit 1; fi
          if SOURCE_REPOSITORY=nandiheath/homelab-cli TAG=v0.3.0 VERSION=invalid RELEASE_ID=1 RELEASE_URL=https://example.invalid ./scripts/update_homelab.sh; then exit 1; fi
          if SOURCE_REPOSITORY=nandiheath/homelab-cli TAG=v0.3.0 VERSION=0.3.1 RELEASE_ID=1 RELEASE_URL=https://example.invalid ./scripts/update_homelab.sh; then exit 1; fi
  integration:
    name: Package index (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install and test published homelab
        if: hashFiles('homelab.hcl') != ''
        run: |
          environment=$(mktemp -d)
          ./bin/hermit init --sources="file://$PWD" "$environment"
          . "$environment/bin/activate-hermit"
          hermit install homelab@latest
          hermit test --no-check-sources homelab@latest
          expected_version=$(awk -F '"' '/^version "/ { value=$2 } END { print value }' homelab.hcl)
          test "$(homelab version)" = "$expected_version"
      - name: Confirm duplicate event is a no-op
        if: hashFiles('homelab.hcl') != ''
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_HERMIT_PACKAGES_DEPLOYER_TOKEN }}
          SOURCE_REPOSITORY: nandiheath/homelab-cli
          RELEASE_ID: '1'
        run: |
          VERSION=$(awk -F '"' '/^version "/ { value=$2 } END { print value }' homelab.hcl)
          TAG="v$VERSION"
          RELEASE_URL="https://github.com/nandiheath/homelab-cli/releases/tag/$TAG"
          export VERSION TAG RELEASE_URL
          ./scripts/update_homelab.sh
          git diff --exit-code -- homelab.hcl
  complete:
    name: Package index
    if: always()
    needs: [validate, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        run: |
          test "${{ needs.validate.result }}" = success
          test "${{ needs.integration.result }}" = success
